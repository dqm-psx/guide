name: Refresh translation names and publish guide

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - 'docs/**/*.md'
      - LICENSE
      - LICENSE.md
      - LICENSE.txt
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Queued events resolve current main once. Later jobs use that exact SHA.
concurrency:
  group: publish-guide
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'dqm-psx/guide' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      guide_revision: ${{ steps.plan.outputs.guide_revision }}
      public_revision: ${{ steps.plan.outputs.public_revision }}
      source_fingerprint: ${{ steps.plan.outputs.source_fingerprint }}
      content_sha256: ${{ steps.plan.outputs.content_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh data and compare with the last successful deployment
        id: plan
        run: node scripts/update-guide.js prepare

  validate:
    needs: prepare
    if: needs.prepare.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.guide_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fixed-name fixtures exercise the committed application only when its
      # application/tooling inputs differ from the last deployed version.
      - name: Validate changed application code
        if: needs.prepare.outputs.mode == 'full'
        run: npm test
      - name: Reproduce the exact prepared publication
        env:
          GUIDE_REVISION: ${{ needs.prepare.outputs.guide_revision }}
          PUBLIC_REVISION: ${{ needs.prepare.outputs.public_revision }}
          SOURCE_FINGERPRINT: ${{ needs.prepare.outputs.source_fingerprint }}
          CONTENT_SHA256: ${{ needs.prepare.outputs.content_sha256 }}
          VALIDATION_MODE: ${{ needs.prepare.outputs.mode }}
        run: >-
          node scripts/update-guide.js verify
          --guide-revision "$GUIDE_REVISION"
          --public-revision "$PUBLIC_REVISION"
          --source-fingerprint "$SOURCE_FINGERPRINT"
          --content-sha256 "$CONTENT_SHA256"
          --mode "$VALIDATION_MODE"
      - name: Validate refreshed data and application invariants
        run: npm run test:unit
      - name: Exercise the actual refreshed publication
        run: npm run test:publication
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
